<script type="text/javascript">
    layui.use(['layer', 'form', 'table', 'laytpl', 'laydate', 'upload'], function () {
        const layer = layui.layer,
            form = layui.form;
        const table = layui.table;

        const upload = layui.upload
        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const headers = {
            "Accept": "application/json; charset=utf-8",
            "X-CSRFToken": csrftoken
        };
        let files = [];
        const uploadContainer = $('#uploadView')
        var globalCurrentPage = 1;
        /*表格渲染*/
        table.render({
            id: 'list',
            elem: '#list',
            url: '/api/account_id/list?line_classify={{ classify }}',
            page: true,
            toolbar: '#toolbar',
            cellMinWidth: 80,
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'id', title: '编号', width: 70, align: 'center', fixed: 'left'},
                {field: 'account_id', title: 'ID', align: 'center', minWidth: 200},
                {field: 'country', title: '国家', align: 'center', sort: true},
                {field: 'age', title: '年龄', align: 'center', sort: true},
                {field: 'work', title: '工作', align: 'center', sort: true},
                {field: 'money', title: '收入', align: 'center', sort: true},
                {field: 'used', title: '使用状态', align: 'center', sort: true, templet: usedTemplate, minWidth: 110},
                {
                    field: 'is_bind',
                    title: '绑定状态',
                    align: 'center',
                    sort: true,
                    templet: bindTemplate,
                    minWidth: 110
                }, {
                    field: 'images',
                    title: '截图',
                    align: 'center',
                    templet: "#operateImageTpl",
                    minWidth: 80
                },
                {field: 'mark', title: '备注', align: 'center'},
                {field: 'create_time', title: '上传时间', align: 'center', sort: true, minWidth: 160},
                {field: 'action', title: '操作', fixed: 'right', toolbar: '#table_control', width: 70}
            ]],
            defaultToolbar: ['filter'],
            done: function (res, curr, count) {
                globalCurrentPage = curr
            }
        });

        /*表格头工具监听*/
        table.on('toolbar(list)', function (obj) {
            const data = obj.data; //获得当前行数据
            const layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
            if (layEvent === 'upload') {
                layer.open({
                    type: 1,
                    area: ['400px', '350px'],
                    title: ['ID上传', 'text-align:center;'],
                    content: $("#addForm")
                });
                initAddForm()
            } else if (layEvent === 'batch_upload') {
                layer.open({
                    type: 1,
                    area: ['400px', '300px'],
                    title: ['ID上传', 'text-align:center;'],
                    content: $("#uploadDialog")
                });
                initBatchUpload()
            } else if (layEvent === 'dispatch') {
                handleDispatch();
            } else if (layEvent === "preview") {
                console.log("obj.data ", obj.data)
                const images = obj.data.images
                if (images === null || images === undefined) {
                    layer.msg('无图片内容');
                    return
                }
                const urls = images.split(",")
                if (urls.length === 0) {
                    layer.msg('无图片内容');
                    return;
                }

                $("#tableImagePreview").children().remove()
                layer.open({
                    type: 1,
                    area: ['500px', '400px'],
                    title: ['截图查看', 'text-align:center;'],
                    content: $("#tableImageDialog"),
                    success: function () {
                        urls.forEach(function (url) {
                            $("#tableImagePreview").append(createTableImage("/media/" + url))
                        })
                    }
                });
            }
        });

        /*表格行工具监听*/
        table.on('tool(list)', function (obj) {
            const layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
            if (layEvent === 'edit') {
                layer.open({
                    type: 1,
                    title: "修改数据",
                    area: ['600px', '600px'],
                    content: $("#editForm")
                });
                initEditForm(obj);
            } else if (layEvent === 'copy') {
                const text = obj.data.account_id
                {% comment %}if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                }{% endcomment %}
                const copyipt = document.createElement("input");
                copyipt.setAttribute("value", text);
                document.body.appendChild(copyipt);
                copyipt.select();
                document.execCommand("copy");
                document.body.removeChild(copyipt);
                layer.msg("复制成功，内容为：" + text, {icon: 6});
            }
        });

        function initSearchForm() {
            form.on('submit(search)', function (data) {
                table.reload('list', {
                    page: {
                        curr: 1 //重新从第 1 页开始
                    },
                    where: data.field
                });
                return false;
            });
            form.render();
        }

        initSearchForm();

        function initAddForm() {
            form.val("addForm", {
                account_id: "",
            });
            files = []
            uploadContainer.children().remove()
            form.on('submit(addSubmit)', function (massage) {
                const formData = new FormData()
                for (let i = 0; i < files.length; i++) {
                    formData.append("files[]", files[i]); // 将每个文件添加到 FormData 对象中
                }
                const field = {
                    ...massage.field
                }
                formData.append("back_type", "{{ back_type }}")
                formData.append("line_classify", "{{ classify }}")
                Object.keys(field).forEach((key) => {
                    formData.append(key, field[key]);
                })
                console.log(massage)
                const load_index = layer.load();
                $.ajax({
                    url: '/api/account_id/upload?line_classify={{ classify }}',
                    type: 'POST',
                    headers: headers,
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (res) {
                        if (res.code >= 0) {
                            console.log("添加成功")
                            layer.closeAll('loading');
                            layer.load(2);
                            layer.msg("添加成功", {icon: 6});
                            setTimeout(function () {
                                table.reload("list", {
                                    page: {
                                        curr: globalCurrentPage
                                    }
                                });
                                layer.closeAll();//关闭所有的弹出层
                            }, 1000);
                        } else {
                            layer.msg(res.msg, {icon: 5})
                            layer.close(load_index)
                        }
                    },
                    error: function () {
                        layer.msg("请求失败", {icon: 5})
                        layer.close(load_index)
                    }
                });
                return false
            })

        }

        function initBatchUpload() {
            let layerId = 0
            const batchUpload = upload.render({
                elem: '#batchUpload',
                url: '/api/account_id/bat_upload?line_classify={{ classify }}',
                accept: 'file',
                field: 'file',
                headers: headers,
                exts: 'txt',
                auto: false,
                data: {
                    "line_classify": "{{ classify }}",
                    'filename': 'test.txt'
                },
                size: 30,
                bindAction: '#btnBatchUpload',
                before: function (obj) {
                    layerId = layer.load()
                    console.log("upload before");
                },
                choose: function (obj) {
                    batchUpload.config.elem.next()[0].value = '';
                    console.log("upload choose", obj);
                    let files = obj.pushFile();
                    console.log("upload choose files = ", files)
                    obj.preview(function (index, file, result) {
                        $('#uploadDemoView').removeClass('layui-hide');
                        $('#p_upload_preview')[0].innerHTML = `文件：${file.name}`
                        batchUpload.config.data.filename = file.name
                    });
                },
                done: function (res, index, upload) {
                    console.log(`upload done res = ${JSON.stringify(res)} index = ${index} upload = ${upload}`);
                    if (res.code < 0) {
                        // layer.closeAll('loading');
                        layer.close(layerId)
                        layer.msg(res.msg, {icon: 5})
                        return
                    }
                    // layer.closeAll();//关闭所有的弹出层
                    layer.close(layerId)
                    table.reload('list', {
                        page: {
                            curr: 1 //重新从第 1 页开始
                        }
                    });
                    $('#uploadDemoView').addClass('layui-hide');
                    layer.msg("上传成功", {icon: 6});
                    handleDispatch();
                },
                error: function (index, upload) {
                    console.log(`upload error index = ${index} upload = ${upload}`)
                    layer.msg("上传失败，请重试", {icon: 5})
                    // layer.closeAll('loading');
                    layer.close(layerId)
                }
            });
        }

        function initEditForm(obj) {
            const data = obj.data;
            $("#p_username").innerHTML = data.username;

            form.val("editForm", {
                id: data.id,
                account_id: data.account_id,
                country: data.country,
                age: data.age,
                work: data.work,
                money: data.money,
                mark: data.mark,
            });

            form.verify({
                account_id: function (value, item) {
                    if (!/^.+$/.test(value)) {
                        $(item).focus();
                        return 'ID不能为空';
                    }
                }
            });
            form.on('submit(editSubmit)', function (massage) {
                console.log("updatw = massage", massage)
                layer.load(1);
                $.ajax({
                    url: '/api/account_id/update?line_classify={{ classify }}',
                    type: 'POST',
                    headers: headers,
                    data: {...massage.field, "line_classify": "{{ classify }}"},
                    success: function (res) {
                        if (res.code >= 0) {
                            console.log("修改成功")
                            layer.closeAll('loading');
                            layer.load(2);
                            layer.msg("修改成功", {icon: 6});
                            setTimeout(function () {
                                layer.closeAll();//关闭所有的弹出层
                                table.reload("list", massage.field);//修改成功修改表格数据不进行跳转
                            }, 1000);
                        } else {
                            layer.msg("修改失败", {icon: 5});
                        }
                    }
                });
                return false
            });
        }

        function handleDispatch() {
            layer.confirm('确定分发数据到用户吗？', function (index) {
                layer.close(index);
                const index2 = layer.load(0);
                $.ajax({
                    url: "/api/account_id/dispatcher?line_classify={{ classify }}",
                    type: "get",
                    headers: headers,
                    dataType: "JSON",
                    success: function (msg) {
                        if (msg.code === 0) {
                            layer.msg(msg.msg, {icon: 6});
                            setTimeout(function () {
                                layer.close(index2);
                            }, 1000);
                            return;
                        }
                        layer.msg(msg.msg, {icon: 5});
                    },
                    error: function () {
                        layer.msg("请求失败", {icon: 5})
                    },
                    complete() {
                        layer.close(index2);
                    }
                });
            });
        }

        function usedTemplate(res) {
            if (res.used === 1) {
                return `<span class="layui-badge layui-bg-green">已使用</span>`
            } else if (res.used === 2) {
                return `<span class="layui-badge">无效</span>`
            } else {
                return `<span class="layui-badge layui-bg-orange">未使用</span>`
            }
        }

        function bindTemplate(res) {
            if (res.is_bind) {
                return `<span class="layui-badge layui-bg-blue">已绑定</span>`
            } else {
                return `<span class="layui-badge layui-bg-gray">未绑定</span>`
            }
        }

        //滚动条
        jQuery(".page-main").scrollbar();

        document.addEventListener('paste', function (event) {
            const items = event.clipboardData && event.clipboardData.items;
            let file = null;
            if (items && items.length) {
                // 检索剪切板items
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        file = items[i].getAsFile();
                        break;
                    }
                }
            }
            if (file === null || file === undefined) {
                return
            }
            console.log("file = ", file, file.type)
            const type = file.type
            if (!type.startsWith("image")) {
                console.log("上传的不是图片")
                return;
            }
            files.push(file)
            // 此时file就是剪切板中的图片文件
            let fileReader = new FileReader()
            fileReader.readAsDataURL(file)
            fileReader.onload = function (f) {
                console.log("fileReader  onload = ", f)
                console.log("fileReader  onload = ", this)
                console.log("fileReader  onload = ", this.result)
                uploadContainer.removeClass('layui-hide')
                uploadContainer.append(createUploadPreview(this.result))
            }

        });

        function createUploadPreview(fileResult) {
            const container = $(document.createElement("div")) // 创建一个容器元素
                .css({
                    position: "relative", // 设置容器为相对定位
                    display: "inline-block" // 设置容器为内联块元素，使其可以与图片并排显示
                });

            const image = $(document.createElement("img"))
                .attr('src', fileResult)
                .attr('alt', '截图' + files.length)
                .attr("key", files.indexOf(fileResult))
                .css({
                    width: '100px',
                    height: '100px'
                });

            const closeButton = $(document.createElement("i"))
                .addClass("layui-icon layui-icon-close")
                .css({
                    position: "absolute", // 设置关闭按钮为绝对定位
                    top: "5px",
                    right: "5px",
                    cursor: "pointer",
                    color: "black",
                    "font-size": "16px"
                });

            closeButton.on("click", function (event) {
                event.stopPropagation();
                container.remove(); // 移除整个容器，包括图片和关闭按钮

                const index = files.indexOf(fileResult);
                if (index > -1) {
                    files.splice(index, 1);
                }
            });

            image.on("click", function () {
                console.log("点击了图片");
                layer.photos({
                    photos: {
                        title: '图片预览',
                        data: [{src: fileResult, alt: '截图' + files.length}], // 注意这里也需要修改
                    },
                    shadeClose: true,
                    closeBtn: 2
                });
            });

            container.append(image); // 将图片添加到容器中
            container.append(closeButton); // 将关闭按钮添加到容器中

            return container; // 返回容器元素
        }

        function createTableImage(src) {
            const container = $(document.createElement("div")) // 创建一个容器元素
                .css({
                    position: "relative", // 设置容器为相对定位
                    display: "inline-block" // 设置容器为内联块元素，使其可以与图片并排显示
                });

            const image = $(document.createElement("img"))
                .attr('src', src)
                .attr('alt', '截图' + files.length)
                .css({
                    width: '100px',
                    height: '100px'
                });

            image.on("click", function () {
                console.log("点击了图片");
                layer.photos({
                    photos: {
                        title: '图片预览',
                        data: [{src: src, alt: '截图'}], // 注意这里也需要修改
                    },
                    shadeClose: true,
                    closeBtn: 2
                });
            });

            container.append(image);
            return container; // 返回容器元素
        }


    });
</script>
